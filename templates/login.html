<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf }}">
<title>Sign in · CareFlow</title>
<link rel="stylesheet" href="/static/css/careflow.css">
</head>
<body class="login-body">
<main class="login-wrap">
  <section class="login-brand">
    <div class="thread-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1>CareFlow</h1>
    <p class="lede">One connected journey for every patient — from first visit to follow-up.</p>
    {% if env != 'production' %}<p class="env-pill">{{ env }} environment</p>{% endif %}
  </section>
  <section class="login-card" aria-labelledby="signin-h">
    <h2 id="signin-h">Sign in</h2>
    <form id="login-form" autocomplete="on" novalidate>
      <label>Work e-mail<input id="email" name="email" type="email" autocomplete="username" required autofocus></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    {% if demo %}
    <div class="demo-box">
      <strong>Quick sign-in</strong>
      <p>Click a role to fill in its login, then press Sign in.</p>
      <div id="demo-accounts" class="demo-list"></div>
    </div>
    {% endif %}
  </section>
</main>
<script type="module" src="/static/js/login.js"></script>
</body>
</html>
